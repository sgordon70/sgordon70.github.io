<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>DropQuest</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: -apple-system, sans-serif;
            text-align: center;
            padding: 60px 20px;
            background: #111;
            color: #eee;
        }
        h1 { font-size: 28px; margin-bottom: 8px; }
        p { color: #ccc; max-width: 420px; margin: 14px auto; line-height: 1.5; }
        .note {
            margin-top: 32px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>
<body>
    <h1>🎯 Someone sent you a quest!</h1>
    <p>A friend made you a real-world scavenger hunt with DropQuest. DropQuest isn't available on the App Store right now, so this quest link can't be opened.</p>
    <p class="note">Already have DropQuest installed? Go back and tap the link again — it should open directly.</p>
</body>
</html>
